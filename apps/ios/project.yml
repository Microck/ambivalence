# Generate Ambivalence.xcodeproj with: xcodegen generate
name: Ambivalence
options:
  bundleIdPrefix: dev.micr
  deploymentTarget:
    iOS: "17.0"
targets:
  Ambivalence:
    type: application
    platform: iOS
    sources: [Ambivalence]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ambivalence
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        CFBundleURLTypes:
          - CFBundleURLName: dev.micr.ambivalence
            CFBundleURLSchemes: [ambivalence]
        NSCameraUsageDescription: Ambivalence shares this camera with your coding agent.
        NSLocalNetworkUsageDescription: Ambivalence looks for your agent on this Wi-Fi so you never type an address.
        NSBonjourServices: [_ambivalence._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen:
          UIColorName: LaunchBlack
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.micr.ambivalence
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
