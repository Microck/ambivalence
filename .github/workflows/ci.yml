name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: bash scripts/e2e-fake.sh

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/test-browser-controls.cjs
      - run: npm ci
      - run: npx e2e-web install chromium --with-deps
      - run: npm run test:e2e
        env:
          E2E_TELEMETRY_DISABLED: "1"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/ambivalence ./cmd/ambivalence
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
        env:
          AMBIVALENCE_BIN: ${{ github.workspace }}/bin/ambivalence
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: ambivalence-android
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      - run: |
          xcodebuild -project Ambivalence.xcodeproj -scheme Ambivalence -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/dev CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/dev/Build/Products/Release-iphoneos/Ambivalence.app Payload/
          zip -qry ambivalence-unsigned.ipa Payload
        working-directory: apps/ios
      - uses: actions/upload-artifact@v4
        with:
          name: ambivalence-ios
          path: apps/ios/ambivalence-unsigned.ipa
          retention-days: 7
      - run: xcodebuild -project Ambivalence.xcodeproj -scheme Ambivalence -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build
        working-directory: apps/ios
      - name: Test saved pairing reset
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if "iPhone" in d["name"]))')
          # The hosted app starts before XCTest. Keep its saved hub empty so only the test
          # model connects to the loopback hubs, which do not advertise through Bonjour.
          xcrun simctl erase "$device_id"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" build/sim/Build/Products/Debug-iphonesimulator/Ambivalence.app
          xcrun simctl privacy "$device_id" grant camera dev.micr.ambivalence
          go build -o build/test-hub ../../cmd/ambivalence
          build/test-hub hub --listen 127.0.0.1:17842 > build/hub-a.log 2>&1 &
          hub_a=$!
          build/test-hub hub --listen 127.0.0.1:17843 > build/hub-b.log 2>&1 &
          hub_b=$!
          trap 'kill "$hub_a" "$hub_b"' EXIT
          xcodebuild -project Ambivalence.xcodeproj -scheme Ambivalence -sdk iphonesimulator -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath build/sim -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
        working-directory: apps/ios
