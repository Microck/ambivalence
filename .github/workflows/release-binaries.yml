name: Release binary verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build supported CLI archives
        run: |
          mkdir -p release-binaries
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              suffix=""
              if [ "$os" = windows ]; then suffix=".exe"; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags='-s -w' -o "release-binaries/ambivalence-$os-$arch$suffix" ./cmd/ambivalence
            done
          done
          python3 scripts/check-release-version.py release-binaries/ambivalence-linux-amd64
          (cd release-binaries && sha256sum ambivalence-* > checksums.txt)
          tar -czf ambivalence-cli-binaries.tar.gz -C release-binaries .
          mkdir extracted-binaries
          tar -xzf ambivalence-cli-binaries.tar.gz -C extracted-binaries
          test -x extracted-binaries/ambivalence-linux-amd64
          (cd extracted-binaries && sha256sum -c checksums.txt)
          python3 scripts/check-release-version.py extracted-binaries/ambivalence-linux-amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ambivalence-cli-binaries
          path: ambivalence-cli-binaries.tar.gz
          retention-days: 7
